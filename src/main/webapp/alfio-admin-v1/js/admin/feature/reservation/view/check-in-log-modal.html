<div class="modal-header">
    <h3>Check-in log for {{attendee.firstName}} {{attendee.lastName}}</h3>
</div>

<div class="modal-body">
    <table class="table">
        <thead>
            <tr>
                <th>Type</th>
                <th>Date</th>
                <th>by</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="audit in entries">
                <td ng-bind="translateType(audit.eventType)"></td>
                <td ng-bind="audit.eventTime|formatDate"></td>
                <td ng-if="audit.username">
                    <!-- If there's a description (likely API key), show it and allow revealing the raw key in the title -->
                    <span ng-if="audit.description">
                        <abbr ng-attr-title="{{revealMap[$index] ? audit.username : (audit.username ? '••••••' + (audit.username | limitTo:6 : (audit.username.length-6)) : '')}}">{{audit.description || audit.username}}</abbr>
                        <a href="#" ng-click="$event.preventDefault(); revealMap[$index] = !revealMap[$index]" class="ml-2">{{revealMap[$index] ? 'Hide' : 'Reveal'}}</a>
                    </span>
                    <!-- Otherwise fall back to existing display: username with personal info in title -->
                    <span ng-if="!audit.description"><abbr title="{{audit.firstName}} {{audit.lastName}} {{audit.email}}">{{audit.username}}</abbr></span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div class="modal-footer">
    <div class="row">
        <div class="col-md-4 col-md-push-8 col-xs-12">
            <button class="btn btn-lg btn-warning btn-block" data-ng-click="cancel()" style="margin-bottom: 10px">Close</button>
        </div>
    </div>
</div>
